
<main data-testid="app-page">

  <div>
    <h1 data-testid="app-title">HHM Modules</h1>
  </div>

  <div class="modules-grid" data-testid="app-modules-list">

    <a
      *ngFor="let module of modules"
      class="module-card"
      [routerLink]="module.route"
      [attr.data-testid]="'app-module-' + module.id">

      <mat-icon
        class="module-icon"
        aria-hidden="true"
        [attr.data-testid]="'app-module-icon-' + module.id">
        {{ module.icon }}
      </mat-icon>

      <div class="module-footer">
        <h2 [attr.data-testid]="'app-module-name-' + module.id">
          {{ module.name }}
        </h2>

        <mat-icon class="module-arrow" aria-hidden="true">
          arrow_forward
        </mat-icon>
      </div>

    </a>

  </div>

</main>
